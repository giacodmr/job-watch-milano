name: JW4 Reportables Compact
on:
  push:
    branches: [jw4-reportables-20261006]
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact markdown
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('.tmp_jw4_reportables.json')
          if not p.exists():
              raise SystemExit('report json missing')
          data=json.load(open(p,encoding='utf-8'))
          lines=['# JW4 Reportables','',f"Count: {data['count']}",'', '| # | Status | Company | Role | Location | Salary | Fit | Link |','|---:|---|---|---|---|---|---:|---|']
          for i,r in enumerate(data['rows'],1):
              st='OPEN' if r.get('current_open') else (r.get('current_status') or 'NOT OPEN')
              vals=[str(i),st,r.get('company') or '',r.get('title') or '',r.get('location') or '',r.get('salary') or 'Not disclosed',str(r.get('fit_score') or ''),r.get('canonical_url') or '']
              vals=[v.replace('|','/').replace('\n',' ') for v in vals]
              lines.append('| '+' | '.join(vals)+' |')
          pathlib.Path('.tmp_jw4_reportables_compact.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit compact report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp_jw4_reportables_compact.md
          git commit -m "Add compact JW4 reportable list" || exit 0
          git push
