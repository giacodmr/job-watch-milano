name: Avature public contract probe

on:
  push:
    branches: [ats-avature-v17]
    paths:
      - '.github/workflows/avature_probe.yml'
      - 'bain_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python bain_probe.py
