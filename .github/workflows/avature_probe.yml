name: Avature public contract probe

on:
  push:
    branches: [ats-avature-v17]
    paths:
      - '.github/workflows/avature_probe.yml'
      - 'apply_avature_patch.py'
      - 'finalize_avature_patch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Apply patch ephemerally and validate
        run: |
          python apply_avature_patch.py
          python finalize_avature_patch.py
          python -m py_compile collector.py
          git diff --check
          python - <<'PY'
          import json
          import collector
          from pathlib import Path

          root = Path('.')
          def company(path, name):
              data = json.loads((root / path).read_text(encoding='utf-8'))
              return next(x for x in data['companies'] if x['company'] == name)

          metlife = company('ats_mapping_jw1.json', 'MetLife')
          result = collector.collect_avature(metlife)
          print('METLIFE', result['coverage'], result['inventory_count'], len(result['jobs']), result['collector'])
          if result['coverage'] != 'VERIFIED' or result['inventory_count'] <= 0:
              raise SystemExit('MetLife did not verify')

          for path, name in [
              ('ats_mapping_jw2.json', 'Bain & Company'),
              ('ats_mapping_jw2.json', 'Deloitte / Monitor Deloitte'),
              ('ats_mapping_jw3.json', 'Siemens Energy'),
          ]:
              row = company(path, name)
              try:
                  collector.collect_avature(row)
              except collector.NotCheckable as exc:
                  print(name, 'NOT_CHECKED_EXPECTED', str(exc))
              else:
                  raise SystemExit(f'{name} unexpectedly verified')
          PY
