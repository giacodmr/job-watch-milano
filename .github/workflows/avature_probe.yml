name: Avature public contract probe

on:
  push:
    branches: [ats-avature-v17]
    paths:
      - '.github/workflows/avature_probe.yml'
      - 'apply_avature_patch.py'
      - 'finalize_avature_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Apply validated production patch
        run: |
          python apply_avature_patch.py
          python finalize_avature_patch.py
          python -m py_compile collector.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector.py ats_mapping_jw1.json ats_mapping_jw2.json ats_mapping_jw3.json
          git diff --cached --name-only
          git diff --cached --quiet && { echo "No production changes"; exit 1; } || true
          git commit -m "Job Watch v1.7 — add strict Avature collector"
          git push origin HEAD:ats-avature-v17
