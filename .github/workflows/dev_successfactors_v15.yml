name: Validate SuccessFactors v1.5

on:
  push:
    branches:
      - ats-successfactors-v15b
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watch-successfactors-v15b
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Apply generic SuccessFactors hardening
        run: |
          python successfactors_v15_patch.py
          python successfactors_v15_safety_patch.py
          python successfactors_v15_parser_fix.py
          python successfactors_v15_missing_helper_fix.py

      - name: Syntax check
        run: python -m py_compile collector.py

      - name: Run full collector
        run: python collector.py

      - name: Validate invariants and print SuccessFactors diagnostics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          totals = {"companies_total": 0, "VERIFIED": 0, "FAILED": 0, "NOT_CHECKED": 0}
          sf_rows = []
          unilever = None
          for batch in ("jw1", "jw2", "jw3", "jw4"):
              snap = json.loads(Path(f"current_jobs_{batch}.json").read_text())
              assert snap["version"] == "1.5", (batch, snap.get("version"))
              for key in totals:
                  totals[key] += int(snap["summary"].get(key, 0))
              for company in snap.get("companies", []):
                  family = (company.get("ats_family") or "").lower()
                  if "successfactors" in family:
                      sf_rows.append((batch.upper(), company.get("company"), company.get("coverage"), company.get("inventory_count"), company.get("collector"), company.get("reason")))
                  if company.get("company") == "Unilever":
                      unilever = company.get("coverage")

          print("TOTALS", totals)
          print("SUCCESSFACTORS")
          for row in sf_rows:
              print(" | ".join("" if x is None else str(x) for x in row))
          assert totals["companies_total"] == 182, totals
          assert totals["FAILED"] == 0, totals
          assert unilever == "NOT_CHECKED", unilever
          PY

      - name: Remove temporary development scaffolding
        run: |
          rm successfactors_v15_patch.py
          rm successfactors_v15_safety_patch.py
          rm successfactors_v15_parser_fix.py
          rm successfactors_v15_missing_helper_fix.py
          rm .github/workflows/dev_successfactors_v15.yml

      - name: Commit validated collector and snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Harden SuccessFactors inventory collection v1.5"
          git push
