name: Temporary SuccessFactors diagnostics

on:
  push:
    branches: [ats-successfactors-v17]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe SuccessFactors portals
        shell: bash
        run: |
          python - <<'PY'
          import json, re, warnings
          import requests
          import collector
          from urllib3.exceptions import InsecureRequestWarning
          warnings.simplefilter('ignore', InsecureRequestWarning)

          cases = {
            'EY / EY-Parthenon': 'https://careers.ey.com/ey/search/',
            'Capgemini Invent': 'https://jobs.capgemini.com/viewalljobs/',
            'Worldline': 'https://jobs.worldline.com/viewalljobs/',
            'Terna': 'https://jobs.terna.it/',
            'ENGIE Italia': 'https://jobs.engie.com/',
            'Pirelli': 'https://jobs.pirelli.com/search/',
            'Heineken Italia': 'https://careers.theheinekencompany.com/search/',
            'Moncler Group': 'https://jobs.moncler.com/search/',
          }

          def compact_matches(text, patterns, maxn=12):
            out=[]
            for pat in patterns:
              for m in re.finditer(pat, text, re.I|re.S):
                s=max(0,m.start()-100); e=min(len(text),m.end()+180)
                frag=re.sub(r'\\s+',' ',text[s:e])
                if frag not in out: out.append(frag)
                if len(out)>=maxn: return out
            return out

          for name,url in cases.items():
            print('\n===', name, '===')
            rec={'url':url}
            try:
              r=requests.get(url,timeout=30,headers={'User-Agent':'job-watch-milano/diag','Accept':'text/html,*/*'})
              rec.update(status=r.status_code,final=r.url,content_type=r.headers.get('content-type'),length=len(r.text))
              text=r.text
              rec['raw_job_path_count']=len(re.findall(r'/job/',text,re.I))
              rec['hints']=compact_matches(text,[r'Results?[^<]{0,120}',r'Showing[^<]{0,120}',r'jobCount',r'totalCount',r'totalResults',r'numFound',r'data-[^=]{0,40}(?:total|count)[^=]*=',r'j2w\\.SearchResults\\.init',r'apiEndpoint',r'searchQuery',r'data-per-page'])
              if r.ok:
                p=collector.SFPageParser(); p.feed(text)
                rec['visible_total']=collector.parse_sf_total(p.visible_text)
                rec['visible_range']=collector.parse_sf_range(p.visible_text)
                rec['anchors']=len(p.anchors)
                rec['job_anchors']=collector.sf_job_anchors(r.url,p)[:5]
                rec['job_anchor_count']=len(collector.sf_job_anchors(r.url,p))
                rec['merged_jobs']=collector.merge_sf_page_jobs(r.url,p)[:5]
                rec['merged_job_count']=len(collector.merge_sf_page_jobs(r.url,p))
                rec['forms']=getattr(p,'form_actions',[])[:10]
                try: rec['tile_config']=collector.sf_tile_config(text,r.url)
                except Exception as e: rec['tile_config_error']=repr(e)
                rec['inventory_links']=[a.get('href') for a in p.anchors if a.get('href') and any(x in a.get('href').lower() for x in ('/search','/viewalljobs','/go/'))][:15]
              print(json.dumps(rec,ensure_ascii=False,default=str))
            except Exception as e:
              rec['error']=type(e).__name__+': '+str(e)
              print(json.dumps(rec,ensure_ascii=False))
              if name=='Moncler Group':
                try:
                  r=requests.get(url,timeout=30,verify=False,headers={'User-Agent':'job-watch-milano/diag','Accept':'text/html,*/*'})
                  print(json.dumps({'moncler_insecure_status':r.status_code,'final':r.url,'length':len(r.text),'hints':compact_matches(r.text,[r'Results?[^<]{0,120}',r'Showing[^<]{0,120}',r'j2w\\.SearchResults\\.init',r'apiEndpoint',r'data-per-page'])},ensure_ascii=False))
                except Exception as e2:
                  print('MONCLER_INSECURE_ERROR',repr(e2))

          # Exercise current collector on the exact mapped company objects.
          for batch in ('jw1','jw2','jw3','jw4'):
            data=collector.read_json(collector.ROOT/f'ats_mapping_{batch}.json',{}) or {}
            for c in data.get('companies',[]):
              if c.get('company') not in cases: continue
              try:
                res=collector.collect_successfactors(c)
                print('COLLECT_RESULT',c.get('company'),json.dumps({'coverage':res.get('coverage'),'count':res.get('inventory_count'),'collector':res.get('collector')},ensure_ascii=False))
              except Exception as e:
                print('COLLECT_ERROR',c.get('company'),type(e).__name__,str(e))
          PY
