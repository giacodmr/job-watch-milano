name: Collect Job Watch vacancies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect_jobs.yml"
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Clean collector formatting artifact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("collector.py")
          text = path.read_text(encoding="utf-8")
          old = 'SAFE_TENANT_RE = re.compile(r"^[A-Za-z0-9._-]+$")\n\\\nDATEISH_RE = re.compile('
          new = 'SAFE_TENANT_RE = re.compile(r"^[A-Za-z0-9._-]+$")\nDATEISH_RE = re.compile('
          if old not in text:
              raise SystemExit("standalone backslash formatting artifact not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python -m py_compile collector.py
          python - <<'PY'
          import collector
          assert collector.location_matches("Milano, IT")
          assert collector.location_matches("London, GB")
          assert not collector.location_matches("London, ON, CA")
          assert not collector.location_matches("Milan, TN, US")
          assert not collector.DATEISH_RE.search("Marketing")
          assert collector.strip_sf_title_prefix("Analyst Analyst Milano, IT", "Analyst") == "Milano, IT"
          PY

      - name: Commit collector cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add collector.py

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Clean collector v1.3 formatting"
          git push
