name: Collect Job Watch vacancies

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Collect public ATS inventories
        run: python collector.py

      - name: Commit updated vacancy snapshots
        shell: bash
        run: |
          if git diff --quiet -- current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json
          git commit -m "Update Job Watch vacancy snapshots"
          git push
