name: Diagnose Job Watch NOT_CHECKED

on:
  push:
    branches:
      - ats-oracle-v14
    paths:
      - .github/workflows/collect_jobs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build NOT_CHECKED report
        run: python coverage_report.py > not_checked_report.txt

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add not_checked_report.txt
          git commit -m "Add NOT_CHECKED diagnostic report" || exit 0
          git push
