name: Collect Job Watch vacancies

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Collect official inventories"
        type: choice
        options: [collect]
        default: collect
  push:
    branches:
      - main
    paths:
      - ".job_watch_run"
      - ".job_watch_manual_run"
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"
    - cron: "15 7 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-state-writer
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Decide whether scheduled recovery is needed
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return None

          should = True
          reason = "manual/push run"
          if os.environ.get("EVENT_NAME") == "schedule":
              today = datetime.now(ZoneInfo("Europe/Rome")).date()
              fresh = True
              snapshots = {}
              for batch in ("jw1", "jw2", "jw3", "jw4"):
                  data = load(f"current_jobs_{batch}.json") or {}
                  generated = data.get("generated_at")
                  snapshots[batch.upper()] = generated
                  try:
                      dt = datetime.fromisoformat(str(generated).replace("Z", "+00:00")).astimezone(ZoneInfo("Europe/Rome"))
                  except Exception:
                      fresh = False
                      reason = f"{batch.upper()} snapshot timestamp missing/invalid"
                      break
                  summary = data.get("summary") or {}
                  if int(summary.get("FAILED", 0)) or int(summary.get("NOT_CHECKED", 0)):
                      fresh = False
                      reason = f"{batch.upper()} has failed/unattempted sources"
                      break
                  if dt.date() != today:
                      fresh = False
                      reason = f"{batch.upper()} snapshot is not from today"
                      break

              state = load("job_watch_run_state.json") or {}
              if fresh and (state.get("source_generated_at") or {}) != snapshots:
                  fresh = False
                  reason = "run-state snapshot timestamps do not match today's collected snapshots"

              amazon = load("amazon_target_check.json") or {}
              amazon_checked = amazon.get("checked_at")
              if fresh:
                  try:
                      amazon_date = datetime.fromisoformat(str(amazon_checked).replace("Z", "+00:00")).astimezone(ZoneInfo("Europe/Rome")).date()
                  except Exception:
                      amazon_date = None
                  if amazon_date != today:
                      fresh = False
                      reason = "Amazon priority snapshot is not from today"
                  elif any(row.get("coverage") != "VERIFIED" for row in (amazon.get("locations") or {}).values()):
                      fresh = False
                      reason = "Amazon target inventory is incomplete"
                  elif (state.get("priority_snapshot_at") or {}).get("Amazon") != amazon_checked:
                      fresh = False
                      reason = "run-state Amazon snapshot does not match today's Amazon check"

              should = not fresh
              if fresh:
                  reason = "today's JW1-JW4, Amazon and run-state snapshots are already reconciled"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if should else 'false'}\n")
          print(("Collector required: " if should else "Collector skipped: ") + reason)
          PY

  collect:
    needs: freshness
    if: needs.freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Prepare and publish current snapshot
        env:
          STAGE: ${{ inputs.stage || 'collect' }}
        run: python job_watch.py "$STAGE" --publish

      - name: Publish readable health summary
        if: always()
        run: |
          if [ -f job_watch_summary.txt ]; then cat job_watch_summary.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve collected checkpoints and health on publication failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-watch-checkpoints-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            current_jobs_jw*.json
            job_memory_jw*.json
            archive/*.jsonl
            amazon_target_check.json
            job_watch_healthcheck.json
            job_watch_summary.txt
            pipeline_execution.json
            daily_activity.json
            rejected_daily_updates.json
