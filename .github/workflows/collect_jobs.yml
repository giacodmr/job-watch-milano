name: Collect Job Watch vacancies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".job_watch_run"
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Syntax check
        run: |
          python -m py_compile collector.py
          python -m py_compile amazon_target_check.py
          python -m py_compile sync_analysis_state.py
          python -m py_compile audit_job_watch.py

      - name: Collect public ATS inventories
        run: python collector.py

      - name: Collect Amazon target inventory
        run: python amazon_target_check.py

      - name: Sync persistent analysis state
        run: python sync_analysis_state.py

      - name: Validate analysis queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          incomplete = []
          for batch in ("jw1","jw2","jw3","jw4"):
              p = Path(f"analysis_results_{batch}.json")
              if not p.exists():
                  incomplete.append(f"{batch.upper()}: state file missing")
                  continue
              data = json.loads(p.read_text(encoding="utf-8"))
              summary = data.get("summary", {})
              pending = int(summary.get("pending_analysis", 0) or 0)
              if pending:
                  incomplete.append(f"{batch.upper()}: {pending} vacancy pending semantic analysis")
          if incomplete:
              print("ANALYSIS QUEUE NOT COMPLETE:")
              print("\n".join(incomplete))
              print("Collector snapshots will still be audited and committed; run must not be reported COMPLETE.")
          PY

      - name: Generate completeness audit
        run: python audit_job_watch.py

      - name: Commit updated vacancy snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          GENERATED_FILES="current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json amazon_target_check.json analysis_results_jw1.json analysis_results_jw2.json analysis_results_jw3.json analysis_results_jw4.json semantic_queue_jw1.json semantic_queue_jw2.json semantic_queue_jw3.json semantic_queue_jw4.json job_watch_audit.json"

          regenerate() {
            echo "Regenerating Job Watch outputs on latest main..."
            python collector.py
            python amazon_target_check.py
            python sync_analysis_state.py
            python audit_job_watch.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main advanced during the run; resetting to latest main before publishing generated files."
              git reset --hard origin/main
              regenerate
            fi

            git add $GENERATED_FILES
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "Update Job Watch vacancy snapshots"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying from latest main (attempt $attempt/3)."
            git fetch origin main
            git reset --hard origin/main
            regenerate
          done

          echo "Could not publish generated Job Watch snapshots after 3 concurrency-safe retries."
          exit 1
