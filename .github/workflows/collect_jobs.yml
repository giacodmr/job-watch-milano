name: Reconcile SuccessFactors tile endpoint

on:
  push:
    branches:
      - ats-successfactors-v15
    paths:
      - sf_tile_probe.py
      - .github/workflows/collect_jobs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Syntax check
        run: python -m py_compile collector.py sf_tile_probe.py

      - name: Reconcile official tile endpoint
        run: python sf_tile_probe.py
