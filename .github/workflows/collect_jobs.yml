name: Collect Job Watch vacancies

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Collect official inventories"
        type: choice
        options: [collect]
        default: collect
  push:
    branches:
      - main
    paths:
      - ".job_watch_run"
      - ".job_watch_manual_run"
  schedule:
    # GitHub scheduled runs can be delayed or dropped, especially at the top
    # of the hour. Use redundant UTC checks away from minute 00 and let the
    # Rome-aware freshness guard below decide which run actually collects.
    # Europe/Rome mapping:
    # - CEST: 21:12/21:42 UTC => 23:12/23:42 local; 22:* are recovery checks.
    # - CET: 21:* are pre-boundary checks; 22:12/22:42 UTC => 23:12/23:42 local.
    - cron: "12,42 21,22 * * *"

permissions:
  contents: write

concurrency:
  group: job-watch-state-writer
  cancel-in-progress: false
  queue: max

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Decide whether scheduled recovery is needed
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from pipeline_state import now
          from collection_freshness import recovery_needed

          should = os.environ.get("EVENT_NAME") != "schedule" or recovery_needed(Path('.'), now())
          reason = "missing, stale or incomplete collection for this Rome workday" if should else "complete snapshots for this Rome workday"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if should else 'false'}\n")
          print(("Collector required: " if should else "Collector skipped: ") + reason)
          PY

  collect:
    needs: freshness
    if: needs.freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Prepare and publish current snapshot
        env:
          STAGE: ${{ inputs.stage || 'collect' }}
        run: python job_watch.py "$STAGE" --publish

      - name: Publish readable health summary
        if: always()
        run: |
          if [ -f job_watch_summary.txt ]; then cat job_watch_summary.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve collected checkpoints and health on publication failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-watch-checkpoints-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            current_jobs_jw*.json
            job_memory_jw*.json
            archive/*.jsonl
            amazon_target_check.json
            job_watch_healthcheck.json
            job_watch_summary.txt
            pipeline_execution.json
            daily_activity.json
            rejected_daily_updates.json
