name: Collect Job Watch vacancies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect_jobs.yml"
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Finalize v1.3 SAP classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("collector.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "        if status in {401, 403}:\n",
              "        if status in {401, 403, 404, 410}:\n",
              1,
          )

          ssl_block = "\n".join([
              "    except requests.exceptions.SSLError as e:",
              "        raise NotCheckable(",
              '            "SuccessFactors public inventory is not safely enumerable because TLS validation failed"',
              "        ) from e",
          ])
          marker = "\n\ndef collect_successfactors(company):"
          if ssl_block not in text:
              if marker not in text:
                  raise SystemExit("SuccessFactors SSL patch point not found")
              text = text.replace(marker, "\n" + ssl_block + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile collector.py

      - name: Collect public ATS inventories
        run: python collector.py

      - name: Commit final v1.3 collector and vacancy snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add collector.py current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Finalize Job Watch collector v1.3"
          git push
