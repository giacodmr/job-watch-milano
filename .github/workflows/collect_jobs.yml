name: Validate SuccessFactors collector v1.5 tile pagination

on:
  push:
    branches:
      - ats-successfactors-v15
    paths:
      - sf_patch_v15c.py
      - sf_validate.py
      - .github/workflows/collect_jobs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Apply tile pagination patch
        run: python sf_patch_v15c.py

      - name: Syntax check
        run: python -m py_compile collector.py sf_validate.py

      - name: Validate targeted SuccessFactors portals
        run: python sf_validate.py

      - name: Persist collector candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector.py
          if git diff --cached --quiet; then
            echo "No collector changes."
            exit 0
          fi
          git commit -m "Add evidenced SuccessFactors tile pagination v1.5"
          git push
