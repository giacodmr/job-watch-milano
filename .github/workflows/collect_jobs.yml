name: Collect Job Watch vacancies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".job_watch_run"
      - ".job_watch_manual_run"
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"
    - cron: "15 7 * * *"
      timezone: "Europe/Rome"
    - cron: "0 8 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-state-writer
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Decide whether scheduled recovery is needed
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          should = True
          if os.environ.get("EVENT_NAME") == "schedule":
              today = datetime.now(ZoneInfo("Europe/Rome")).date()
              fresh = True
              for batch in ("jw1", "jw2", "jw3", "jw4"):
                  path = Path(f"current_jobs_{batch}.json")
                  if not path.exists():
                      fresh = False
                      break
                  generated = (json.loads(path.read_text(encoding="utf-8")) or {}).get("generated_at")
                  try:
                      dt = datetime.fromisoformat(str(generated).replace("Z", "+00:00")).astimezone(ZoneInfo("Europe/Rome"))
                  except Exception:
                      fresh = False
                      break
                  if dt.date() != today:
                      fresh = False
                      break
              should = not fresh
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if should else 'false'}\n")
          print("Collector required" if should else "Today's JW1-JW4 snapshots already exist; recovery run skipped.")
          PY

  collect:
    needs: freshness
    if: needs.freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Syntax and guardrail tests
        run: |
          python -m py_compile collector.py amazon_target_check.py sync_analysis_state.py audit_job_watch.py
          python -m py_compile harden_job_watch_state.py certify_job_watch.py validate_job_watch_state.py validate_job_watch_inputs.py validate_certified_run.py
          python -m unittest -q test_job_watch_guardrails.py

      - name: Validate persistent inputs
        run: python validate_job_watch_inputs.py

      - name: Collect public ATS inventories
        run: python collector.py

      - name: Collect Amazon target inventory
        run: python amazon_target_check.py

      - name: Sync and harden persistent analysis state
        run: |
          python sync_analysis_state.py
          python harden_job_watch_state.py

      - name: Validate analysis queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          incomplete = []
          for batch in ("jw1", "jw2", "jw3", "jw4"):
              data = json.loads(Path(f"analysis_results_{batch}.json").read_text(encoding="utf-8"))
              pending = int((data.get("summary") or {}).get("pending_analysis", 0) or 0)
              if pending:
                  incomplete.append(f"{batch.upper()}: {pending} vacancy pending semantic analysis")
          if incomplete:
              print("FULL SEMANTIC BACKLOG REMAINS:")
              print("\n".join(incomplete))
              print("Historical backlog does not by itself block DAILY_COMPLETE; certification separately validates today's actionable delta.")
          PY

      - name: Generate fail-closed completeness audit
        run: |
          python audit_job_watch.py
          python certify_job_watch.py
          python validate_job_watch_state.py
          python validate_certified_run.py

      - name: Commit updated vacancy snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          GENERATED_FILES="current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json amazon_target_check.json analysis_results_jw1.json analysis_results_jw2.json analysis_results_jw3.json analysis_results_jw4.json semantic_queue_jw1.json semantic_queue_jw2.json semantic_queue_jw3.json semantic_queue_jw4.json job_watch_audit.json job_watch_healthcheck.json user_job_decisions.json"

          regenerate() {
            echo "Regenerating Job Watch outputs on latest main..."
            python collector.py
            python amazon_target_check.py
            python sync_analysis_state.py
            python harden_job_watch_state.py
            python audit_job_watch.py
            python certify_job_watch.py
            python validate_job_watch_state.py
            python validate_certified_run.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main advanced during the run; resetting to latest main before publishing generated files."
              git reset --hard origin/main
              regenerate
            fi

            git add $GENERATED_FILES
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "Update Job Watch vacancy snapshots"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying from latest main (attempt $attempt/3)."
            git fetch origin main
            git reset --hard origin/main
            regenerate
          done

          echo "Could not publish generated Job Watch snapshots after 3 concurrency-safe retries."
          exit 1
