name: Collect Job Watch vacancies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect_jobs.yml"
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Fix v1.3 SuccessFactors metadata parsing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("collector.py")
          text = path.read_text(encoding="utf-8")

          old_date = '''DATEISH_RE = re.compile(
              r"(?:\\b\\d{1,2}[./-]\\d{1,2}[./-]\\d{2,4}\\b|"
              r"\\b\\d{4}[./-]\\d{1,2}[./-]\\d{1,2}\\b|"
              r"\\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\b)",
              re.I,
          )'''.replace("              ", "")
          new_date = '''DATEISH_RE = re.compile(
              r"(?:\\b\\d{1,2}[./-]\\d{1,2}[./-]\\d{2,4}\\b|"
              r"\\b\\d{4}[./-]\\d{1,2}[./-]\\d{1,2}\\b|"
              r"\\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\\s+\\d{1,2}(?:,\\s*\\d{4})?\\b|"
              r"\\b\\d{1,2}\\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)(?:\\s+\\d{4})?\\b)",
              re.I,
          )'''.replace("              ", "")
          if old_date in text:
              text = text.replace(old_date, new_date, 1)
          elif new_date not in text:
              raise SystemExit("DATEISH_RE patch point not found")

          old_loc = '''def location_matches(location) -> bool:
              """Match only target cities, not substrings such as Roma inside Romagna."""
              if not location:
                  return False
              return bool(TARGET_LOCATION_RE.search(str(location)))'''.replace("              ", "")
          new_loc = '''def location_matches(location) -> bool:
              """Match target cities while excluding obvious North-American namesakes."""
              if not location:
                  return False
              s = str(location)
              if not TARGET_LOCATION_RE.search(s):
                  return False
              if re.search(r"\\b(?:United States|USA|Canada)\\b", s, re.I):
                  return False
              if re.search(r"\\bLondon\\s*,\\s*(?:ON|Ontario)\\b", s, re.I):
                  return False
              if re.search(r"\\b(?:Milan|Rome)\\s*,\\s*[A-Z]{2}\\s*,\\s*(?:US|USA)\\b", s, re.I):
                  return False
              return True'''.replace("              ", "")
          if old_loc in text:
              text = text.replace(old_loc, new_loc, 1)
          elif new_loc not in text:
              raise SystemExit("location_matches patch point not found")

          old_rows = '''def parse_sf_rows(base: str, parser: SFPageParser) -> dict[str, dict]:
              """Extract jobs from classic SuccessFactors grid rows (Title / Location / Date)."""
              found: dict[str, dict] = {}
              for row in parser.rows:
                  job_anchor = None
                  for a in row.get("anchors") or []:
                      u = normalize_abs_url(base, a.get("href"))
                      if u and same_host(base, u) and "/job/" in urlparse(u).path.casefold():
                          job_anchor = (u, clean_text(a.get("text")) or clean_text(a.get("title")))
                          break
                  if not job_anchor:
                      continue
                  u, title = job_anchor
                  cells = [clean_text(x) for x in row.get("cells") or [] if clean_text(x)]
                  non_title = [x for x in cells if x != title]
                  date_value = next((x for x in reversed(non_title) if DATEISH_RE.search(x or "")), None)
                  location = next((x for x in non_title if x != date_value), None)
                  found[u] = {"url": u, "title": title, "location": location, "published_at": date_value}
              return found'''.replace("              ", "")
          new_rows = '''def strip_sf_title_prefix(value: str | None, title: str | None) -> str | None:
              s = clean_text(value)
              t = clean_text(title)
              if not s or not t:
                  return s
              for _ in range(3):
                  if s[:len(t)].casefold() != t.casefold():
                      break
                  s = clean_text(s[len(t):])
                  if not s:
                      break
              return s


          def parse_sf_rows(base: str, parser: SFPageParser) -> dict[str, dict]:
              """Extract jobs from classic SuccessFactors grid rows (Title / Location / Date)."""
              found: dict[str, dict] = {}
              for row in parser.rows:
                  job_anchor = None
                  for a in row.get("anchors") or []:
                      u = normalize_abs_url(base, a.get("href"))
                      if u and same_host(base, u) and "/job/" in urlparse(u).path.casefold():
                          job_anchor = (u, clean_text(a.get("text")) or clean_text(a.get("title")))
                          break
                  if not job_anchor:
                      continue
                  u, title = job_anchor
                  cells = [clean_text(x) for x in row.get("cells") or [] if clean_text(x)]
                  non_title = []
                  for value in cells:
                      if value == title:
                          continue
                      cleaned = strip_sf_title_prefix(value, title)
                      if cleaned:
                          non_title.append(cleaned)
                  date_value = next(
                      (x for x in reversed(non_title) if len(x) <= 40 and DATEISH_RE.search(x or "")),
                      None,
                  )
                  location = next((x for x in non_title if x != date_value), None)
                  found[u] = {"url": u, "title": title, "location": location, "published_at": date_value}
              return found'''.replace("              ", "")
          if old_rows in text:
              text = text.replace(old_rows, new_rows, 1)
          elif new_rows not in text:
              raise SystemExit("parse_sf_rows patch point not found")

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile collector.py
          python - <<'PY'
          import collector
          checks = {
              "Milano, IT": True,
              "London, GB": True,
              "London, ON, CA": False,
              "London, Ontario, Canada": False,
              "Milan, TN, US": False,
              "Rome, GA, USA": False,
          }
          for location, expected in checks.items():
              actual = collector.location_matches(location)
              if actual != expected:
                  raise SystemExit(f"location test failed: {location}: {actual} != {expected}")
          PY

      - name: Collect public ATS inventories
        run: python collector.py

      - name: Commit parsing fix and vacancy snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add collector.py current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix SuccessFactors metadata parsing"
          git push
