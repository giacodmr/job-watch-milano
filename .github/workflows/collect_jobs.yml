name: Collect Job Watch vacancies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect_jobs.yml"
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Apply v1.3 hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("collector.py")
          text = path.read_text(encoding="utf-8")

          if "KNOWN_GREENHOUSE_TOKENS" not in text:
              marker = "}\n\n_thread_local = threading.local()"
              lines = [
                  "}",
                  "",
                  "# Greenhouse board tokens already exercised successfully by collector v1.2.",
                  "# Bolt is deliberately excluded: its old `bolt` token returned 404.",
                  "KNOWN_GREENHOUSE_TOKENS = {",
                  '    "Adyen": "adyen",',
                  '    "N26": "n26",',
                  '    "SumUp": "sumup",',
                  '    "Trade Republic": "traderepublicbank",',
                  "}",
                  "",
                  "_thread_local = threading.local()",
              ]
              if marker not in text:
                  raise SystemExit("KNOWN_NOT_CHECKED insertion point not found")
              text = text.replace(marker, "\n".join(lines), 1)

          old = "\n".join([
              "    if token and SAFE_TENANT_RE.fullmatch(token):",
              "        return token",
              "    return None",
              "",
              "",
              "def collect_greenhouse",
          ])
          new = "\n".join([
              "    if token and SAFE_TENANT_RE.fullmatch(token):",
              "        return token",
              '    return KNOWN_GREENHOUSE_TOKENS.get(company.get("company"))',
              "",
              "",
              "def collect_greenhouse",
          ])
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("greenhouse_token patch point not found")

          if "def sf_get_html(" not in text:
              marker = "\ndef collect_successfactors(company):"
              helper_lines = [
                  "",
                  "def sf_get_html(url: str) -> tuple[str, str]:",
                  '    """SAP access-denied pages are uncheckable, not collector failures."""',
                  "    try:",
                  "        return get_html(url)",
                  "    except requests.HTTPError as e:",
                  "        status = e.response.status_code if e.response is not None else None",
                  "        if status in {401, 403}:",
                  "            raise NotCheckable(",
                  '                f"SuccessFactors public inventory not enumerable from runner (HTTP {status})"',
                  "            ) from e",
                  "        raise",
                  "",
                  "",
                  "def collect_successfactors(company):",
              ]
              if marker not in text:
                  raise SystemExit("SuccessFactors helper insertion point not found")
              text = text.replace(marker, "\n".join(helper_lines), 1)

          text = text.replace("html_text, current_url = get_html(", "html_text, current_url = sf_get_html(")
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile collector.py

      - name: Collect public ATS inventories
        run: python collector.py

      - name: Commit v1.3 hotfix and vacancy snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add collector.py current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Hotfix Job Watch collector v1.3"
          git push
