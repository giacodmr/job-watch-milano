name: Finalize Job Watch collector v1.4

on:
  push:
    branches:
      - ats-oracle-v14
    paths:
      - finalize_v14.py
      - .github/workflows/collect_jobs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watch-collector
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Build standalone v1.4
        run: python finalize_v14.py

      - name: Harden Workday transient non-JSON responses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("collector.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "_collect_workday_v13 = collect_workday"
          end_marker = "_collect_smartrecruiters_v13 = collect_smartrecruiters"
          start = text.find(start_marker)
          end = text.find(end_marker, start + len(start_marker)) if start >= 0 else -1
          if start < 0 or end < 0:
              raise SystemExit("Workday v1.4 block delimiters not found")
          replacement = '''_collect_workday_v13 = collect_workday

          def collect_workday(company):
              last_error = None
              for _attempt in range(2):
                  try:
                      return _collect_workday_v13(company)
                  except requests.exceptions.JSONDecodeError as e:
                      last_error = e
                      continue
                  except CollectorError as e:
                      message = str(e).casefold()
                      if "pagination safety limit" in message:
                          raise NotCheckable(f"Workday inventory exceeds safe exhaustive-page limit: {e}") from e
                      if "paging stopped early" not in message and "count mismatch" not in message:
                          raise
                      last_error = e
              if isinstance(last_error, requests.exceptions.JSONDecodeError):
                  raise NotCheckable(f"Workday returned non-JSON inventory data after retry: {last_error}")
              raise NotCheckable(f"Workday inventory changed during enumeration after retry: {last_error}")


          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Syntax check standalone collector
        run: python -m py_compile collector.py

      - name: Collect with standalone v1.4
        run: python collector.py

      - name: Validate release invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          verified = failed = not_checked = 0
          unilever = None
          for batch in ("jw1", "jw2", "jw3", "jw4"):
              data = json.loads(Path(f"current_jobs_{batch}.json").read_text(encoding="utf-8"))
              s = data["summary"]
              verified += s["VERIFIED"]
              failed += s["FAILED"]
              not_checked += s["NOT_CHECKED"]
              if data.get("version") != "1.4":
                  raise SystemExit(f"{batch}: expected version 1.4, got {data.get('version')}")
              for company in data.get("companies", []):
                  if company.get("company") == "Unilever":
                      unilever = company
          print({"VERIFIED": verified, "FAILED": failed, "NOT_CHECKED": not_checked})
          if failed != 0:
              raise SystemExit(f"Release blocked: FAILED={failed}")
          if verified < 68:
              raise SystemExit(f"Release blocked: VERIFIED unexpectedly regressed to {verified}")
          if not unilever or unilever.get("coverage") != "NOT_CHECKED":
              raise SystemExit(f"Release blocked: Unilever must remain NOT_CHECKED, got {unilever}")
          PY

      - name: Commit validated v1.4 contents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector.py ats_mapping_jw1.json ats_mapping_jw2.json ats_mapping_jw3.json ats_mapping_jw4.json current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json
          git commit -m "Persist validated Job Watch collector v1.4 contents"
          git push
