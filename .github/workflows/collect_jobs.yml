name: Collect Job Watch vacancies

on:
  push:
    branches:
      - ats-oracle-v14
    paths:
      - collector_v14.py
      - coverage_report.py
      - .github/workflows/collect_jobs.yml
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Syntax check
        run: python -m py_compile collector.py collector_v14.py coverage_report.py

      - name: Report NOT_CHECKED before collection
        run: python coverage_report.py

      - name: Collect public ATS inventories
        run: python collector_v14.py

      - name: Report NOT_CHECKED after collection
        run: python coverage_report.py

      - name: Commit updated vacancy snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Job Watch vacancy snapshots"
          git push
