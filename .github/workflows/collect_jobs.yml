name: Collect Job Watch vacancies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".job_watch_run"
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Syntax check
        run: |
          python -m py_compile collector.py
          python -m py_compile amazon_target_check.py
          python -m py_compile sync_analysis_state.py
          python -m py_compile audit_job_watch.py

      - name: Collect public ATS inventories
        run: python collector.py

      - name: Collect Amazon target inventory
        run: python amazon_target_check.py

      - name: Sync persistent analysis state
        run: python sync_analysis_state.py

      - name: Generate completeness audit
        run: python audit_job_watch.py

      - name: Commit updated vacancy snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json amazon_target_check.json \
            analysis_results_jw1.json analysis_results_jw2.json analysis_results_jw3.json analysis_results_jw4.json \
            job_watch_audit.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Job Watch vacancy snapshots"
          git pull --rebase origin main
          git push origin main
