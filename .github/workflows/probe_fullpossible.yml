name: Probe Imperial stable ID coverage
on:
  push:
    branches: [ats-fullpossible-v17]
    paths: [.github/workflows/probe_fullpossible.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reconcile all Clinch stable identifiers
        shell: python
        run: |
          import html,re,urllib.request
          from urllib.parse import urljoin,urlparse
          H={'User-Agent':'Mozilla/5.0 job-watch-probe/1.0','Accept':'text/html,*/*'}
          UUID_RE=re.compile(r'([0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$',re.I)
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r:
                  return html.unescape(r.read().decode('utf-8','replace')),r.geturl()
          def component(body,cls):
              vals=[]
              pat=rf'<li[^>]*class=["\'][^"\']*\b{re.escape(cls)}\b[^"\']*["\'][^>]*>(.*?)</li>'
              for block in re.findall(pat,body,re.I|re.S):
                  m=re.search(r'<span[^>]*>(.*?)</span>',block,re.I|re.S)
                  text=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',m.group(1) if m else block)).strip()
                  if text and text not in vals: vals.append(text)
              return vals
          base='https://jobs.impbrands.com/jobs/search'; rows=[]; expected=None
          for page in range(1,10):
              body,final=get(base if page==1 else base+f'?page={page}')
              plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',body))
              m=re.search(r'Displaying\s+(\d+)\s*[-–]\s*(\d+)\s+of\s+(\d+)\s+in total',plain,re.I)
              if not m: raise SystemExit('count missing')
              lo,hi,total=map(int,m.groups()); expected=expected or total
              if total!=expected or lo!=len(rows)+1: raise SystemExit('paging changed')
              page_rows=[]
              for attrs,row in re.findall(r'<tr\b([^>]*)>(.*?)</tr>',body,re.I|re.S):
                  if not re.search(r'\brole=["\']link["\']',attrs,re.I): continue
                  um=re.search(r'\bdata-job-url=["\']([^"\']+)',attrs,re.I)
                  if not um: raise SystemExit('missing URL')
                  page_rows.append(urljoin(final,html.unescape(um.group(1))))
              if len(page_rows)!=hi-lo+1: raise SystemExit('card/range mismatch')
              rows+=page_rows
              if len(rows)==expected: break
          if len(rows)!=expected or len(set(rows))!=expected: raise SystemExit('inventory mismatch')
          ids={}; sources={'requisition':0,'uuid':0}; missing=[]
          for u in rows:
              body,final=get(u)
              req=component(body,'job-component-requisition-identifier')
              uuid=UUID_RE.search(urlparse(final).path.rstrip('/'))
              if len(req)==1:
                  sid='req:'+req[0]; source='requisition'
              elif not req and uuid:
                  sid='uuid:'+uuid.group(1).lower(); source='uuid'
              else:
                  missing.append((u,req,uuid.group(1) if uuid else None)); continue
              if sid in ids: raise SystemExit(f'duplicate stable ID {sid}')
              ids[sid]=u; sources[source]+=1
          print('IMPERIAL_STABLE_ID_COVERAGE','total=',expected,'ids=',len(ids),'sources=',sources,'missing=',missing)
          if missing or len(ids)!=expected: raise SystemExit('stable ID coverage incomplete')
