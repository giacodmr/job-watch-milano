name: Probe FULL-possible ATS
on:
  push:
    branches: [ats-fullpossible-v17]
    paths: [.github/workflows/probe_fullpossible.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Exhaust Axpo Teamtailor aggregate board
        shell: python
        run: |
          import os,sys,re,html
          from urllib.parse import urljoin,urlparse,unquote
          sys.path.insert(0,os.getcwd())
          import collector
          base='https://careers.axpo.com/jobs'
          all_keys=[]; expected=None; hosts={}
          for page in range(1,30):
              text,final=collector.get_html(base+f'?page={page}')
              p=collector.TeamtailorPageParser(final); p.feed(text); p.close()
              total=collector.teamtailor_total(p.visible_text)
              if page==1: expected=total
              elif total not in (None,expected): raise SystemExit(f'total changed {expected}->{total} page={page}')
              raw=html.unescape(text)
              rows=[]
              for href in re.findall(r'href=["\']([^"\']+)["\']',raw,re.I):
                  u=urljoin(final,href); pu=urlparse(u)
                  m=re.search(r'/jobs/(\d+)(?:[-/]|$)',unquote(pu.path),re.I)
                  if not m: continue
                  host=pu.netloc.casefold()
                  # Teamtailor aggregates can link subsidiary boards on another Teamtailor custom domain.
                  key=(host,m.group(1))
                  if key not in rows: rows.append(key)
              print('PAGE',page,'TOTAL',total,'CARDS',len(rows),'HOSTS',sorted({h for h,_ in rows}))
              if not rows:
                  print('STOP_EMPTY_PAGE',page); break
              all_keys.extend(rows)
              for h,_ in rows: hosts[h]=hosts.get(h,0)+1
              if len(set(all_keys))>=expected: break
          unique=set(all_keys)
          print('EXPECTED',expected,'SEEN',len(all_keys),'UNIQUE',len(unique),'DUPLICATES',len(all_keys)-len(unique))
          print('HOST_DISTRIBUTION',sorted(hosts.items(),key=lambda x:(-x[1],x[0])))
          if expected is None or len(unique)!=expected: raise SystemExit('Axpo aggregate did not reconcile')
