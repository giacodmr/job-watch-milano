name: Probe Bolt Greenhouse
on:
  push:
    branches: [ats-fullpossible-v17]
    paths: [.github/workflows/probe_fullpossible.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Bolt careers integration markers
        run: |
          echo 'probe-v2'
          curl -LfsS 'https://bolt.eu/en/careers/positions/' -o /tmp/bolt.html
          echo '--- greenhouse markers ---'
          grep -Eio '.{0,160}(greenhouse|gh_jid|grnhse|job_board).{0,320}' /tmp/bolt.html | head -80 || true
          echo '--- old token status ---'
          curl -L -sS -o /tmp/bolt-api.json -w '%{http_code}\n' 'https://boards-api.greenhouse.io/v1/boards/bolt/jobs'
          head -c 1000 /tmp/bolt-api.json || true
