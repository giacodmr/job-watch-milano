name: Probe Imperial Clinch cards
on:
  push:
    branches: [ats-fullpossible-v17]
    paths: [.github/workflows/probe_fullpossible.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect job card metadata
        shell: python
        run: |
          import html, re, urllib.request
          H={'User-Agent':'Mozilla/5.0 job-watch-probe/1.0','Accept':'text/html,*/*'}
          u='https://jobs.impbrands.com/jobs/search'
          with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r:
              body=html.unescape(r.read().decode('utf-8','replace'))
          needles=[
            'brand-ambassador-promoter-emilia-romagna-marche-contratto-a-tempo-determinato',
            'business-planning-commercial-insights-senior-analyst-contratto-a-tempo-determinato',
            'crm-business-intelligence-coordinator-rome-italy',
          ]
          for needle in needles:
              p=body.lower().find(needle.lower())
              print('\nNEEDLE',needle,'POS',p)
              if p>=0:
                  print(body[max(0,p-2500):p+3500])
          print('\n--- requisition ids / location-ish attributes ---')
          for pat in (
              r'data-[^=\s]+=["\'][^"\']+["\']',
              r'\b[A-Z]{2}\d{5}\b',
              r'Rome, Italy',
              r'Milan[^<]{0,80}Italy',
          ):
              vals=[]
              for m in re.finditer(pat,body,re.I):
                  v=m.group(0)
                  if v not in vals: vals.append(v)
              print('PATTERN',pat,'COUNT',len(vals),'SAMPLE',vals[:40])
