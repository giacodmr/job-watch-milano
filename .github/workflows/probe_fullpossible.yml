name: Probe FULL-possible ATS
on:
  push:
    branches: [ats-fullpossible-v17]
    paths: [.github/workflows/probe_fullpossible.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe OC&C Eploy inventory contract
        shell: python
        run: |
          import re, urllib.request, html
          from urllib.parse import urljoin,urlparse,parse_qs
          H={'User-Agent':'Mozilla/5.0 job-watch-probe/1.0'}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r: return r.read().decode('utf-8','replace'),r.geturl()
          base='https://careers.occstrategy.com/vacancies/vacancy-search-results.aspx'
          first,final=get(base)
          text=html.unescape(first)
          print('TOTALS',re.findall(r'\b(\d+)\s+Vacanc(?:y|ies)\b',text,re.I))
          print('PAGE_STATUS',re.findall(r'Page:\s*(\d+)\s+of\s+(\d+)',re.sub(r'<[^>]+>',' ',text),re.I))
          pagers=[]
          for href,label in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
              lab=re.sub(r'<[^>]+>',' ',label).strip()
              if lab in {'1','2','Next','Last'} or 'page' in href.lower(): pagers.append((lab,urljoin(final,html.unescape(href))))
          print('PAGERS',pagers[:30])
          urls=[]
          for candidate in [final]+[u for _,u in pagers]:
              if candidate in urls: continue
              urls.append(candidate); page,_=get(candidate); decoded=html.unescape(page)
              jobs=[]
              for href,title in re.findall(r'<a[^>]+href=["\']([^"\']*/vacancies/(\d+)/[^"\']+)["\'][^>]*>(.*?)</a>',decoded,re.I|re.S):
                  pass
              pairs=[]
              for m in re.finditer(r'href=["\']([^"\']*/vacancies/(\d+)/[^"\']+)["\']',decoded,re.I):
                  u=urljoin(candidate,html.unescape(m.group(1))); key=m.group(2)
                  if (key,u) not in pairs: pairs.append((key,u))
              print('EPLOY_PAGE',candidate,'JOBS',len(pairs),'IDS',[x[0] for x in pairs])
      - name: Probe Imperial Brands counted pages
        shell: python
        run: |
          import re, urllib.request, html
          from urllib.parse import urljoin,urlparse
          H={'User-Agent':'Mozilla/5.0 job-watch-probe/1.0'}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r: return r.read().decode('utf-8','replace'),r.geturl()
          base='https://jobs.impbrands.com/jobs/search'
          all_urls=[]; expected=None
          for n in range(1,6):
              page,final=get(base+f'?page={n}')
              plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html.unescape(page)))
              m=re.search(r'Displaying\s+(?:all\s+)?(?:\d+\s*[-–]\s*\d+\s+of\s+)?(\d+)\s+(?:in total|entries)',plain,re.I)
              if not m:
                  m=re.search(r'Displaying\s+\d+\s*[-–]\s*\d+\s+of\s+(\d+)\s+in total',plain,re.I)
              total=int(m.group(1)) if m else None
              if expected is None and total is not None: expected=total
              links=[]
              for href in re.findall(r'href=["\']([^"\']+)["\']',page,re.I):
                  u=urljoin(final,html.unescape(href)); p=urlparse(u)
                  if p.netloc.casefold()==urlparse(final).netloc.casefold() and re.match(r'^/jobs/[^/?#]+$',p.path) and p.path!='/jobs/search':
                      if u not in links: links.append(u)
              print('IMPERIAL_PAGE',n,'TOTAL',total,'JOBS',len(links),'FIRST',links[:2],'LAST',links[-2:])
              if not links: break
              all_urls += links
              if expected is not None and len(set(all_urls))>=expected: break
          print('IMPERIAL_RECONCILE','expected=',expected,'seen=',len(all_urls),'unique=',len(set(all_urls)),'dups=',len(all_urls)-len(set(all_urls)))
