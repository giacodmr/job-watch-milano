name: Probe FULL-possible ATS
on:
  push:
    branches: [ats-fullpossible-v17]
    paths: [.github/workflows/probe_fullpossible.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Candidate inventory
        run: |
          python - <<'PY'
          import json
          for b in ('jw1','jw2','jw3','jw4'):
              m=json.load(open('ats_mapping_'+b+'.json'))
              c=json.load(open('current_jobs_'+b+'.json'))
              coverage={x['company']:x.get('coverage') for x in c['companies']}
              for x in m['companies']:
                  v=x.get('verification',{})
                  a=x.get('ats',{})
                  f=str(a.get('family') or '')
                  if (v.get('level')=='FULL' or v.get('full_inventory_possible') is True) and coverage.get(x['company'])=='NOT_CHECKED':
                      if x['company'] in ('Amazon','American Express') or any(k in f.lower() for k in ('successfactors','avature','oracle')):
                          continue
                      print(b.upper(), '|', x['company'], '|', f, '| tenant=',a.get('tenant'),'| inventory=',a.get('inventory_url'),'| feed=',a.get('public_api_or_feed'),'| total=',v.get('total_count_available'))
          PY
