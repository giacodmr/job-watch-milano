name: Probe Bolt Greenhouse
on:
  push:
    branches: [ats-fullpossible-v17]
    paths: [.github/workflows/probe_fullpossible.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Bolt positions bundle and paging
        run: |
          set -euo pipefail
          JS='https://assets.careers-v3.bolt.eu/3.9.108/_next/static/chunks/app/%5Blang%5D/careers/positions/page-cc4fa43219ea1678.js'
          curl -LfsS "$JS" -o /tmp/positions.js
          echo '--- bundle markers ---'
          grep -Eo '.{0,300}(api|jobs|positions|career|total|page).{0,800}' /tmp/positions.js | head -120 || true
          echo '--- page counts ---'
          for n in 1 2 20 24 25 26 30; do
            curl -LfsS "https://bolt.eu/en/careers/positions/?page=$n" -o "/tmp/p$n.html"
            printf 'page=%s apply=%s view=%s bytes=%s\n' "$n" "$(grep -o 'Apply now' "/tmp/p$n.html" | wc -l)" "$(grep -o 'View role' "/tmp/p$n.html" | wc -l)" "$(wc -c < "/tmp/p$n.html")"
            grep -Eo 'gh_jid[^&"< ]*' "/tmp/p$n.html" | head -5 || true
          done
