name: Quick SuccessFactors probe

on:
  push:
    branches: [ats-successfactors-v17]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Exhaustively validate evidenced service orderings
        run: |
          python - <<'PY'
          import re, json, math, html, requests
          from collections import Counter
          from urllib.parse import urljoin

          cases = [
            ('Worldline','https://jobs.worldline.com/search/','recent'),
            ('ENGIE-empty','https://jobs.engie.com/search/',''),
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'}

          def location(job):
            v=job.get('jobLocationShort')
            if isinstance(v,list):
              vals=[str(x).strip() for x in v if str(x).strip()]
              if vals: return ' | '.join(vals)
            elif isinstance(v,str) and v.strip(): return v.strip()
            coords=job.get('jobLocationShortWithCoordinates')
            if isinstance(coords,list):
              vals=[str(x.get('value') or '').strip() for x in coords if isinstance(x,dict) and str(x.get('value') or '').strip()]
              if vals: return ' | '.join(vals)
            return None

          for name,url,sort_by in cases:
            print('\n===',name,'===')
            s=requests.Session(); s.headers.update(headers)
            page=s.get(url,timeout=20); page.raise_for_status(); text=page.text
            assert 'xweb/rmk-jobs-search' in text
            scripts=re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']',text,re.I)
            mgr=[urljoin(page.url,x.replace('&amp;','&')) for x in scripts if 'j2w.searchManager' in x]
            assert len(mgr)==1
            js=s.get(mgr[0],timeout=20); js.raise_for_status()
            epm=re.search(r'type\s*:\s*["\']POST["\']\s*,\s*url\s*:\s*["\']([^"\']+)["\']',js.text,re.I)
            assert epm; endpoint=urljoin(page.url,epm.group(1))
            locale_m=re.search(r'\blocale\s*:\s*["\']([^"\']+)',text,re.I); assert locale_m; locale=locale_m.group(1)
            if sort_by == '':
              # Only accept the empty ordering because this exact unfiltered payload is explicitly present in ENGIE's public HTML.
              assert re.search(r'pageNumber\s*:\s*0\s*,\s*sortBy\s*:\s*["\']["\']\s*,\s*keywords\s*:\s*["\']["\']\s*,\s*location\s*:\s*["\']["\']', text, re.I|re.S), 'empty sort payload not evidenced'
            else:
              assert 'sortBy:"recent"' in re.sub(r'\s+','',js.text), 'recent ordering not evidenced'

            def fetch(n):
              p={'keywords':'','locale':locale,'location':'','pageNumber':n,'sortBy':sort_by}
              r=s.post(endpoint,json=p,timeout=25,headers={'Referer':page.url,'Accept':'application/json, text/plain, */*'}); r.raise_for_status(); d=r.json()
              assert isinstance(d,dict) and isinstance(d.get('totalJobs'),int)
              rows=[]
              for item in d.get('jobSearchResult') or []:
                assert isinstance(item,dict) and isinstance(item.get('response'),dict)
                rows.append(item['response'])
              return d['totalJobs'],rows

            total,first=fetch(0); size=len(first); assert total>=0 and (total==0 or size>0)
            pages=0 if total==0 else math.ceil(total/size); assert pages<=500
            allrows=[]; pageids=[]; totals=[]
            for n in range(pages):
              t,rows=(total,first) if n==0 else fetch(n); totals.append(t)
              expected=size if n<pages-1 else total-size*(pages-1)
              assert len(rows)==expected, (n,len(rows),expected)
              ids=[]
              for j in rows:
                jid=str(j.get('id') or '').strip(); title=str(j.get('unifiedStandardTitle') or '').strip()
                assert jid and title
                ids.append(jid); allrows.append(j)
              pageids.append(ids)
            counts=Counter(str(j.get('id') or '').strip() for j in allrows)
            dups=sorted(k for k,v in counts.items() if v>1)
            missing=[str(j.get('id') or '') for j in allrows if not location(j)]
            t0,r0=fetch(0); tl,rl=(t0,r0) if pages<=1 else fetch(pages-1)
            stable=all(t==total for t in totals) and t0==total==tl and [str(x.get('id') or '') for x in r0]==pageids[0] and [str(x.get('id') or '') for x in rl]==pageids[-1]
            urls=[]
            for j in allrows[:2]:
              jid=str(j['id']); slug=html.unescape(str(j.get('unifiedUrlTitle') or ''))
              u=urljoin(page.url,f'/job/{slug}/{jid}-{locale}/'); rr=s.get(u,timeout=15,allow_redirects=True)
              urls.append({'url':u,'status':rr.status_code,'final':rr.url,'has_id':jid in rr.text})
            print('EXHAUSTIVE '+json.dumps({'sortBy':sort_by,'total':total,'page_size':size,'pages':pages,'raw_rows':len(allrows),'unique_ids':len(counts),'duplicates':dups[:30],'missing_location_count':len(missing),'stable_edges':stable,'first_ids':pageids[0] if pageids else [],'last_ids':pageids[-1] if pageids else [],'url_checks':urls},ensure_ascii=False))
          PY
