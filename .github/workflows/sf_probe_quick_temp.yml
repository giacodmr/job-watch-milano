name: Quick SuccessFactors probe

on:
  push:
    branches: [ats-successfactors-v17]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Inspect remaining dynamic contracts and supported sort controls
        run: |
          python - <<'PY'
          import re, json, requests
          from urllib.parse import urljoin

          sites = {
            'Capgemini':'https://jobs.capgemini.com/search/',
            'Worldline':'https://jobs.worldline.com/search/',
            'ENGIE':'https://jobs.engie.com/search/',
            'Pirelli':'https://jobs.pirelli.com/search/',
          }
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*'}
          for name,url in sites.items():
            print('\n===',name,'===')
            s=requests.Session(); s.headers.update(headers)
            try:
              r=s.get(url,timeout=20); print('PAGE',r.status_code,r.url,'len',len(r.text)); r.raise_for_status()
            except Exception as e:
              print('PAGE_ERROR',type(e).__name__,str(e)); continue
            text=r.text
            scripts=re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']',text,re.I)
            mgr=[urljoin(r.url,x.replace('&amp;','&')) for x in scripts if 'j2w.searchManager' in x]
            print('WIDGET', 'xweb/rmk-jobs-search' in text, 'MANAGERS', json.dumps(mgr,ensure_ascii=False))
            sort_fragments=[]
            for m in re.finditer(r'(?i)sort(?:By|by|field|order)?',text):
              frag=re.sub(r'\s+',' ',text[max(0,m.start()-180):min(len(text),m.end()+350)])
              if frag not in sort_fragments: sort_fragments.append(frag)
              if len(sort_fragments)>=15: break
            print('HTML_SORT',json.dumps(sort_fragments,ensure_ascii=False))
            if not mgr: continue
            try:
              js=s.get(mgr[0],timeout=20); js.raise_for_status()
            except Exception as e:
              print('JS_ERROR',type(e).__name__,str(e)); continue
            endpoint_m=re.search(r'type\s*:\s*["\']POST["\']\s*,\s*url\s*:\s*["\']([^"\']+)["\']',js.text,re.I)
            endpoint=urljoin(r.url,endpoint_m.group(1)) if endpoint_m else None
            js_sort=[]
            for m in re.finditer(r'(?i)sortBy',js.text):
              frag=re.sub(r'\s+',' ',js.text[max(0,m.start()-280):min(len(js.text),m.end()+500)])
              if frag not in js_sort: js_sort.append(frag)
              if len(js_sort)>=15: break
            string_values=sorted(set(re.findall(r'["\']([A-Za-z][A-Za-z0-9_-]{1,30})["\']', ''.join(js_sort))))
            print('CONTRACT',json.dumps({'endpoint':endpoint,'js_sort_fragments':js_sort,'nearby_string_values':string_values},ensure_ascii=False))
            # Probe only the publicly evidenced default payload when a modern service exists.
            if endpoint and 'xweb/rmk-jobs-search' in text:
              locale_m=re.search(r'\blocale\s*:\s*["\']([^"\']+)',text,re.I)
              if locale_m:
                locale=locale_m.group(1)
                for n in (0,1):
                  pr=s.post(endpoint,json={'keywords':'','locale':locale,'location':'','pageNumber':n,'sortBy':'recent'},timeout=20,headers={'Referer':r.url,'Accept':'application/json, text/plain, */*'})
                  try: data=pr.json()
                  except Exception: data={}
                  ids=[]
                  for row in (data.get('jobSearchResult') or []) if isinstance(data,dict) else []:
                    if isinstance(row,dict) and isinstance(row.get('response'),dict): ids.append(str(row['response'].get('id') or ''))
                  print('DEFAULT_PAGE',n,json.dumps({'status':pr.status_code,'totalJobs':data.get('totalJobs') if isinstance(data,dict) else None,'ids':ids},ensure_ascii=False))
          PY
