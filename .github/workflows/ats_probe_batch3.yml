name: ATS Batch 3 - Public Inventory Probe
on:
  pull_request:
    paths:
      - "tools/ats_diagnostic_batch3.py"
      - "test_ats_coverage_batch3.py"
      - "dojo_collector.py"
      - "collector.py"
      - "ats_mapping_jw1.json"
      - ".github/workflows/ats_probe_batch3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Inspect first-party and public ATS boards
        run: python tools/ats_diagnostic_batch3.py
