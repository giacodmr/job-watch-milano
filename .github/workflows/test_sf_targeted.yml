name: Targeted SuccessFactors pagination test

on:
  push:
    branches:
      - successfactors-v15
    paths:
      - collector_sf_v15.py
      - collector_sf_v15b.py
      - collector_sf_v15c.py
      - .github/workflows/test_sf_targeted.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Test all practical SuccessFactors boards except EY
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import collector_sf_v15c as exp

          targets = {
              "Intesa Sanpaolo",
              "Worldline",
              "Swiss Re",
              "Capgemini Invent",
              "Terna",
              "Italgas",
              "E.ON Italia",
              "ENGIE Italia",
              "Mundys",
              "Pirelli",
              "Heineken Italia",
              "Moncler Group",
              "Bolton Group",
              "Boehringer Ingelheim",
          }
          companies = {}
          for batch in ("jw1", "jw2", "jw3", "jw4"):
              data = json.loads(Path(f"ats_mapping_{batch}.json").read_text())
              for c in data.get("companies", []):
                  if c.get("company") in targets:
                      companies[c["company"]] = c
          missing = targets - companies.keys()
          if missing:
              raise SystemExit(f"Missing mappings: {sorted(missing)}")
          verified = 0
          for name in sorted(targets):
              result, supported = exp.base.collect_company(companies[name])
              if result.get("coverage") == "VERIFIED":
                  verified += 1
              print(json.dumps({
                  "company": name,
                  "supported": supported,
                  "coverage": result.get("coverage"),
                  "collector": result.get("collector"),
                  "inventory_count": result.get("inventory_count"),
                  "target_jobs": len(result.get("jobs") or []),
                  "reason": result.get("reason"),
                  "source_url": result.get("source_url"),
              }, ensure_ascii=False))
          print(json.dumps({"targeted_successfactors_verified": verified, "tested": len(targets)}))
          PY
