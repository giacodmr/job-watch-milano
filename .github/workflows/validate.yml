name: Validate Job Watch
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "*.py"
      - ".github/workflows/**"
      - "job_watch_rules.json"
      - "job_watch_batches.json"
      - "companies_job_watch_v2.json"
      - "company_candidates.json"
      - "ats_mapping_*.json"
      - "pipeline_contract.json"
      - "requirements-job-watch.txt"
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Determine whether full validation is needed
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python job_watch_bridge_ci.py
      - if: steps.validation.outputs.needed == 'true'
        run: python preflight_job_watch.py
      - if: steps.validation.outputs.needed == 'true'
        run: python validate_job_watch_inputs.py
      - if: steps.validation.outputs.needed == 'true'
        run: python -m unittest -q
      - if: steps.validation.outputs.needed == 'true'
        run: python job_watch.py sync
      - if: steps.validation.outputs.needed == 'true'
        run: python validate_job_watch_state.py --strict
      - name: Worklist has a stable projection
        if: steps.validation.outputs.needed == 'true'
        run: |
          cp daily_worklist.json /tmp/first-worklist.json
          python job_watch.py sync
          cmp daily_worklist.json /tmp/first-worklist.json
