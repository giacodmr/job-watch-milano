name: Test SuccessFactors v1.5

on:
  push:
    branches:
      - successfactors-v15
    paths:
      - collector_sf_v15.py
      - collector_sf_v15b.py
      - .github/workflows/test_successfactors_v15.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watch-successfactors-v15
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Syntax check
        run: python -m py_compile collector.py collector_sf_v15.py collector_sf_v15b.py coverage_report.py

      - name: Run full collector with SuccessFactors hardening
        run: python collector_sf_v15b.py

      - name: Coverage report
        run: python coverage_report.py

      - name: Validate no failures
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          totals = {"VERIFIED": 0, "FAILED": 0, "NOT_CHECKED": 0}
          sf = []
          for batch in ("jw1", "jw2", "jw3", "jw4"):
              data = json.loads(Path(f"current_jobs_{batch}.json").read_text())
              for k in totals:
                  totals[k] += data["summary"][k]
              for c in data.get("companies", []):
                  if c.get("collector") in {"collect_successfactors", "successfactors_jobs2web_metadata"}:
                      sf.append((batch, c.get("company"), c.get("coverage"), c.get("inventory_count"), c.get("reason")))
          print("TOTALS", totals)
          print("SUCCESSFACTORS")
          for row in sf:
              print(" | ".join(str(x) for x in row))
          if totals["FAILED"] != 0:
              raise SystemExit(f"FAILED={totals['FAILED']}")
          if totals["VERIFIED"] < 72:
              raise SystemExit(f"VERIFIED regressed below validated v1.5 floor: {totals['VERIFIED']}")
          PY

      - name: Commit test snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "Test SuccessFactors v1.5 coverage"
          git pull --rebase origin successfactors-v15
          git push
