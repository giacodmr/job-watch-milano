name: Diagnose Amazon v1.7

on:
  push:
    branches:
      - ats-amazon-v17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-watch-amazon-v17-diag
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Syntax check
        run: python -m py_compile amazon_diag_v17.py

      - name: Probe Amazon Jobs
        run: python amazon_diag_v17.py
