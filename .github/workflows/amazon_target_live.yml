name: Amazon target live check

on:
  push:
    branches:
      - amazon-target-live-20260915
    paths:
      - ".amazon_target_run"

permissions:
  contents: write

jobs:
  amazon-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Run Amazon target check
        run: python amazon_target_check.py
      - name: Commit Amazon target snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amazon_target_check.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Amazon target live check"
          git push
