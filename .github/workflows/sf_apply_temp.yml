name: Temporary SuccessFactors patch runner
on:
  push:
    branches: [ats-successfactors-v17]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ats-successfactors-v17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python sf_patch_temp.py
          python -m py_compile collector.py
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collector.py
          git commit -m 'feat: harden exhaustive SuccessFactors coverage'
          git push origin HEAD:ats-successfactors-v17
