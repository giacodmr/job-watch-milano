name: Job Watch — initial multi-day local D1 tests
on:
  push:
    branches:
      - codex/job-watch-real-import-preflight
    paths:
      - .github/workflows/job_watch_multiday_offline.yml
      - apps/web/tools/model-c-importer.ts
      - apps/web/tests/model-c-importer.test.ts
      - apps/web/model-c/catalog/migrations/0008_phased_initial_preparation.sql
permissions:
  contents: read
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run tests/model-c-importer.test.ts
