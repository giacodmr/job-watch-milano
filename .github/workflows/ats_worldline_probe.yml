name: ATS Worldline - Official SuccessFactors Contract
on:
  pull_request:
    paths:
      - "tools/ats_worldline_probe.py"
      - "tools/ats_worldline_inventory_audit.py"
      - "worldline_collector.py"
      - "test_worldline_collector.py"
      - "collector.py"
      - "ats_mapping_jw1.json"
      - ".github/workflows/ats_worldline_probe.yml"
permissions:
  contents: read
jobs:
  worldline-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5
      - name: Inspect Worldline public SuccessFactors page and JavaScript contract
        run: python tools/ats_worldline_probe.py
      - name: Worldline official source regression tests
        run: python -m unittest -q test_worldline_collector
      - name: Enumerate full Worldline public jobs endpoint and validate target details
        run: python tools/ats_worldline_inventory_audit.py
      - name: Collect Worldline first-party validated Italy details, preserve PARTIAL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import collector
          company=next(c for c in json.loads(Path("ats_mapping_jw1.json").read_text())["companies"] if c["company"]=="Worldline")
          result,_=collector.collect_company(company)
          print("WORLDLINE_LIVE "+json.dumps({
           "coverage":result.get("coverage"),"inventory_count":result.get("inventory_count"),
           "collector":result.get("collector"),"reason":result.get("reason"),
           "reconciliation":result.get("reconciliation"),"jobs":[
             {"id":x["source_id"],"title":x["title"],"location":x["location"],"url":x["canonical_url"]}
             for x in (result.get("jobs") or [])]},ensure_ascii=False))
          if result.get("coverage")!="PARTIAL" or result.get("collector")!="worldline_sf_official_recruiting_partial_validated_details_v1":
           raise SystemExit("Worldline drift/no first-party observed source")
          if not result.get("jobs"):
           raise SystemExit("Worldline first-party Italy detail inventory did not retain observed jobs")
          PY
