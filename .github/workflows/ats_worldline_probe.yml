name: ATS Worldline - Official SuccessFactors Contract
on:
  pull_request:
    paths:
      - "tools/ats_worldline_probe.py"
      - ".github/workflows/ats_worldline_probe.yml"
permissions:
  contents: read
jobs:
  worldline-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5
      - name: Inspect Worldline public SuccessFactors page and JavaScript contract
        run: python tools/ats_worldline_probe.py
