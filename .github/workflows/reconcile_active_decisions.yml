name: Reconcile Job Watch active decisions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".job_watch_reconcile_run"

permissions:
  contents: write

concurrency:
  group: job-watch-state-writer
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Validate reconciliation code and persistent inputs
        run: |
          python -m py_compile reconcile_external_lifecycle.py certify_job_watch.py validate_job_watch_inputs.py
          python -m unittest -q test_external_lifecycle.py test_job_watch_guardrails.py
          python validate_job_watch_inputs.py

      - name: Reconcile current first-party lifecycle
        run: python reconcile_external_lifecycle.py

      - name: Sync and certify state
        run: |
          python sync_analysis_state.py
          python harden_job_watch_state.py
          python audit_job_watch.py
          python certify_job_watch.py
          python validate_job_watch_state.py
          python validate_certified_run.py

      - name: Publish reconciled lifecycle safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          GENERATED_FILES="current_jobs_jw1.json current_jobs_jw2.json current_jobs_jw3.json current_jobs_jw4.json analysis_results_jw1.json analysis_results_jw2.json analysis_results_jw3.json analysis_results_jw4.json semantic_queue_jw1.json semantic_queue_jw2.json semantic_queue_jw3.json semantic_queue_jw4.json job_watch_audit.json job_watch_healthcheck.json user_job_decisions.json"

          regenerate() {
            python reconcile_external_lifecycle.py
            python sync_analysis_state.py
            python harden_job_watch_state.py
            python audit_job_watch.py
            python certify_job_watch.py
            python validate_job_watch_state.py
            python validate_certified_run.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main advanced during lifecycle reconciliation; regenerating on latest main."
              git reset --hard origin/main
              regenerate
            fi
            git add $GENERATED_FILES
            if git diff --cached --quiet; then
              echo "No lifecycle-state changes to publish."
              exit 0
            fi
            git commit -m "Reconcile Job Watch active decision lifecycles"
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            regenerate
          done
          echo "Could not publish lifecycle reconciliation after 3 retries."
          exit 1
