name: Validate SuccessFactors retry hardening

on:
  push:
    branches:
      - ats-successfactors-v15b
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watch-sf-retry-v15
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Apply retry hardening
        run: python sf_retry_patch.py

      - name: Syntax check
        run: python -m py_compile collector.py

      - name: Run full collector
        run: python collector.py

      - name: Validate release invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          totals = {"companies_total": 0, "VERIFIED": 0, "FAILED": 0, "NOT_CHECKED": 0}
          unilever = None
          zurich = None
          for batch in ("jw1", "jw2", "jw3", "jw4"):
              data = json.loads(Path(f"current_jobs_{batch}.json").read_text(encoding="utf-8"))
              assert data.get("version") == "1.5", (batch, data.get("version"))
              for key in totals:
                  totals[key] += int(data["summary"].get(key, 0))
              for company in data.get("companies", []):
                  if company.get("company") == "Unilever":
                      unilever = company.get("coverage")
                  if company.get("company") == "Zurich":
                      zurich = company
          print("TOTALS", totals)
          print("ZURICH", zurich and {k: zurich.get(k) for k in ("coverage", "inventory_count", "collector", "reason")})
          assert totals["companies_total"] == 182, totals
          assert totals["FAILED"] == 0, totals
          assert totals["VERIFIED"] >= 76, totals
          assert unilever == "NOT_CHECKED", unilever
          assert zurich and zurich.get("coverage") == "VERIFIED", zurich
          assert int(zurich.get("inventory_count") or 0) > 0, zurich
          PY

      - name: Coverage report
        run: python coverage_report.py

      - name: Remove temporary diagnostics and generated bytecode
        shell: bash
        run: |
          rm -f sf_retry_patch.py sf_diag_remaining.py
          rm -f .github/workflows/dev_sf_diag_remaining.yml .github/workflows/dev_sf_retry_validate.yml
          rm -rf __pycache__

      - name: Commit validated v1.5 state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Finalize SuccessFactors collector v1.5"
          git push
