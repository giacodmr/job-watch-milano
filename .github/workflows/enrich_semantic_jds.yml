name: Enrich semantic JDs

on:
  workflow_dispatch:
  push:
    paths:
      - "enrich_semantic_jds.py"
      - ".jd_enrichment_run"

permissions:
  contents: write

concurrency:
  group: enrich-semantic-jds
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: pip install requests
      - name: Fetch official JD details
        run: python enrich_semantic_jds.py
      - name: Publish JD cache safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add semantic_jd_cache_jw*.json
          if git diff --cached --quiet; then
            echo "No JD cache changes"
            exit 0
          fi
          git commit -m "Refresh semantic JD cache"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
