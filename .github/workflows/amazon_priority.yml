name: Amazon Priority Job Watch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".amazon_priority_run"
  schedule:
    - cron: "15 7 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: job-watch-state-writer
  cancel-in-progress: false

jobs:
  collect-amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Syntax check
        run: python -m py_compile amazon_target_check.py

      - name: Collect exhaustive Amazon target inventory
        run: python amazon_target_check.py

      - name: Validate target-city coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("amazon_target_check.json").read_text(encoding="utf-8"))
          failed = []
          for city in ("Milan", "Rome", "Luxembourg", "London"):
              x = data.get("locations", {}).get(city, {})
              if x.get("coverage") != "VERIFIED":
                  failed.append(f"{city}: coverage={x.get('coverage')}")
              if int(x.get("inventory_count", -1)) != int(x.get("api_reported_hits_sum", -2)):
                  failed.append(
                      f"{city}: inventory_count={x.get('inventory_count')} "
                      f"api_reported_hits_sum={x.get('api_reported_hits_sum')}"
                  )
          if failed:
              raise SystemExit("AMAZON PRIORITY INCOMPLETE\n" + "\n".join(failed))
          print("Amazon Milan/Rome/Luxembourg/London official inventories fully reconciled.")
          PY

      - name: Commit Amazon priority snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amazon_target_check.json
          if git diff --cached --quiet; then
            echo "No Amazon snapshot changes to commit."
            exit 0
          fi
          git commit -m "Update Amazon priority job snapshot"
          git pull --rebase origin main
          git push origin main
