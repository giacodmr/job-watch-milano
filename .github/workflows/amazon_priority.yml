name: Amazon Priority Job Watch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".amazon_priority_run"

permissions:
  contents: write

concurrency:
  group: job-watch-state-writer
  cancel-in-progress: false

jobs:
  collect-amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Preflight and regression tests
        run: |
          python preflight_job_watch.py
          python -m unittest -q
      - name: Collect and publish Amazon state
        run: python job_watch.py amazon --publish
