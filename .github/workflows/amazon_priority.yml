name: Amazon Priority Job Watch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".amazon_priority_run"

permissions:
  contents: write

concurrency:
  group: job-watch-state-writer
  cancel-in-progress: false

jobs:
  collect-amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Syntax check
        run: |
          python -m py_compile amazon_target_check.py
          python -m py_compile sync_analysis_state.py
          python -m py_compile audit_job_watch.py
          python -m py_compile validate_job_watch_state.py

      - name: Collect exhaustive Amazon target inventory
        run: python amazon_target_check.py

      - name: Sync Amazon changes into semantic state
        run: |
          python sync_analysis_state.py
          python audit_job_watch.py
          python validate_job_watch_state.py

      - name: Validate target-city coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("amazon_target_check.json").read_text(encoding="utf-8"))
          failed = []
          for city in ("Milan", "Rome", "Luxembourg", "London"):
              x = data.get("locations", {}).get(city, {})
              if x.get("coverage") != "VERIFIED":
                  failed.append(f"{city}: coverage={x.get('coverage')}")
              if int(x.get("inventory_count", -1)) != int(x.get("api_reported_hits_sum", -2)):
                  failed.append(
                      f"{city}: inventory_count={x.get('inventory_count')} "
                      f"api_reported_hits_sum={x.get('api_reported_hits_sum')}"
                  )
          if failed:
              raise SystemExit("AMAZON PRIORITY INCOMPLETE\n" + "\n".join(failed))
          print("Amazon Milan/Rome/Luxembourg/London official inventories fully reconciled.")
          PY

      - name: Publish Amazon and derived semantic state safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          GENERATED_FILES="amazon_target_check.json analysis_results_jw1.json analysis_results_jw2.json analysis_results_jw3.json analysis_results_jw4.json semantic_queue_jw1.json semantic_queue_jw2.json semantic_queue_jw3.json semantic_queue_jw4.json job_watch_audit.json job_watch_healthcheck.json"

          regenerate() {
            echo "Regenerating Amazon priority and derived state on latest main..."
            python amazon_target_check.py
            python sync_analysis_state.py
            python audit_job_watch.py
            python validate_job_watch_state.py
          }

          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              regenerate
            fi

            git add $GENERATED_FILES
            if git diff --cached --quiet; then
              echo "No Amazon/semantic state changes to publish."
              exit 0
            fi

            git commit -m "Update Amazon priority and derived Job Watch state"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying (attempt $attempt/3)."
            git fetch origin main
            git reset --hard origin/main
            regenerate
          done

          echo "Could not publish Amazon priority state after 3 retries."
          exit 1
