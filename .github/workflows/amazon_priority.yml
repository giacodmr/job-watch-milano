name: Amazon Priority Job Watch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".amazon_priority_run"

permissions:
  contents: write

concurrency:
  group: job-watch-state-writer
  cancel-in-progress: false
  queue: max

jobs:
  collect-amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Collect and publish Amazon state
        run: python job_watch.py amazon --publish

      - name: Publish readable health summary
        if: always()
        run: |
          if [ -f job_watch_summary.txt ]; then cat job_watch_summary.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve collected checkpoints and health on publication failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-watch-checkpoints-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            current_jobs_jw*.json
            job_memory_jw*.json
            archive/*.jsonl
            amazon_target_check.json
            job_watch_healthcheck.json
            job_watch_summary.txt
            pipeline_execution.json
            daily_activity.json
            rejected_daily_updates.json
