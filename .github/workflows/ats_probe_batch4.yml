name: ATS Batch 4 - Official Source Discovery
on:
  pull_request:
    paths:
      - "tools/ats_diagnostic_batch4.py"
      - ".github/workflows/ats_probe_batch4.yml"
      - "collector.py"
      - "ats_mapping_jw1.json"
      - "test_ats_coverage_batch4.py"
      - "fineco_collector.py"
      - "checkout_collector.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Checkout.com adapter regression contracts
        run: python -m unittest -q test_ats_coverage_batch4
      - name: Inspect first-party career page contracts without writes
        run: python tools/ats_diagnostic_batch4.py
      - name: Checkout.com official first-party Ashby publisher smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import collector
          row=next(x for x in json.loads(Path("ats_mapping_jw1.json").read_text())["companies"] if x["company"]=="Checkout.com")
          result,attempted=collector.collect_company(row)
          report={
            "company":"Checkout.com","attempted":attempted,
            "coverage":result.get("coverage"),"collector":result.get("collector"),
            "inventory_count":result.get("inventory_count"),
            "target_jobs_count":len(result.get("jobs") or []),"source_url":result.get("source_url"),
            "reason":result.get("reason"),"reconciliation":result.get("reconciliation"),
            "sample":[{"id":j["source_id"],"title":j["title"],"location":j["location"],
                       "url":j["canonical_url"]} for j in (result.get("jobs") or [])[:20]]
          }
          print("CHECKOUT_LIVE "+json.dumps(report,ensure_ascii=False))
          if result.get("coverage")!="VERIFIED":
              raise SystemExit("Checkout.com first-party Ashby publisher NOT VERIFIED")
          PY
