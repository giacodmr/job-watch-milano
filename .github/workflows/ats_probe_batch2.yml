name: ATS Batch 2 - Official Public Contract Diagnostics
on:
  pull_request:
    paths:
      - "tools/ats_diagnostic_batch2.py"
      - ".github/workflows/ats_probe_batch2.yml"
      - "collector.py"
      - "test_ats_coverage_batch2.py"
      - "ats_mapping_jw1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5
      - name: Regression contracts
        run: python -m unittest -q test_ats_coverage_batch2
      - name: Inspect Worldline, Revolut and Nexi public HTML
        run: python tools/ats_diagnostic_batch2.py
      - name: Live Nexi Oracle public requisitions, read only
        run: |
          python - <<'PY'
          import json
          import collector
          from pathlib import Path

          row = next(r for r in json.loads(Path("ats_mapping_jw1.json").read_text())["companies"] if r["company"] == "Nexi")
          result, attempted = collector.collect_company(row)
          print(json.dumps({
            "attempted":attempted,"company":"Nexi","coverage":result.get("coverage"),
            "collector":result.get("collector"),"inventory_count":result.get("inventory_count"),
            "target_jobs_validated":len(result.get("jobs") or []),
            "reason":result.get("reason"),"source_url":result.get("source_url"),
            "sample":[{"id":j.get("source_id"),"title":j.get("title"),"location":j.get("location"),
                       "url":j.get("canonical_url")} for j in (result.get("jobs") or [])[:15]],
          },ensure_ascii=False,indent=2))
          PY
      - name: Live Revolut official Next.js UUID cross-check, read only
        run: |
          python - <<'PY'
          import json
          import collector
          from pathlib import Path
          row = next(r for r in json.loads(Path("ats_mapping_jw1.json").read_text())["companies"] if r["company"] == "Revolut")
          result,attempted = collector.collect_company(row)
          print("REVOLUT_SMOKE "+json.dumps({
            "attempted": attempted, "coverage":result.get("coverage"),
            "collector":result.get("collector"),"total":result.get("inventory_count"),
            "target_jobs_validated":len(result.get("jobs") or []),
            "reason":result.get("reason"),"reconciliation":result.get("reconciliation"),
            "sample":[{"id":j.get("source_id"),"title":j.get("title"),
                       "location":j.get("location")[:180] if j.get("location") else None,
                       "url":j.get("canonical_url")} for j in (result.get("jobs") or [])[:20]],
          },ensure_ascii=False))
          if not result.get("jobs"):
              raise SystemExit("Revolut adapter did not validate any target roles")
          PY
