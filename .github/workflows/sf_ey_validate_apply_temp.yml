name: Temporary EY exhaustive validation and apply

on:
  push:
    branches: [ats-successfactors-v17]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ats-successfactors-v17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Apply generic SuccessFactors ceiling and validate EY exhaustively
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('collector.py')
          s=p.read_text(encoding='utf-8')
          needle='SF_MAX_PAGES = MAX_PAGES'
          assert s.count(needle) == 1, f'unexpected strict ceiling occurrences: {s.count(needle)}'
          s=s.replace(needle, 'SF_MAX_PAGES = 500', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile collector.py
          python - <<'PY'
          import json
          import collector
          company=None
          for batch in ('jw1','jw2','jw3','jw4'):
              data=collector.read_json(collector.ROOT/f'ats_mapping_{batch}.json',{}) or {}
              for c in data.get('companies',[]):
                  if c.get('company') == 'EY / EY-Parthenon':
                      company=c
                      break
          assert company is not None, 'EY mapping not found'
          result=collector.collect_successfactors(company)
          print('EY_VALIDATION', json.dumps({
              'coverage': result.get('coverage'),
              'collector': result.get('collector'),
              'inventory_count': result.get('inventory_count'),
              'target_jobs': len(result.get('jobs') or []),
              'source_url': result.get('source_url'),
          }, ensure_ascii=False))
          assert result.get('coverage') == 'VERIFIED'
          assert int(result.get('inventory_count') or 0) > 6250, 'validation did not exceed old 250-page ceiling at 25/page'
          ids=[j.get('source_id') for j in (result.get('jobs') or [])]
          assert len(ids) == len(set(ids)), 'duplicate target requisition IDs'
          PY
      - name: Commit production change only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collector.py
          git diff --cached --check
          git commit -m 'fix: allow exhaustive large SuccessFactors inventories'
          git push origin HEAD:ats-successfactors-v17
