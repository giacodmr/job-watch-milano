name: ATS PayPal - Public Eightfold Search Probe
on:
  pull_request:
    paths:
      - "tools/ats_paypal_probe.py"
      - ".github/workflows/ats_paypal_probe.yml"
permissions:
  contents: read
jobs:
  paypal-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5
      - name: Inspect PayPal official Eightfold public listing and robots
        run: python tools/ats_paypal_probe.py
