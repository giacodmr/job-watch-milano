name: Sync Job Watch semantic state

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "daily_updates.json"
      - "job_watch_rules.json"
      - "job_watch_batches.json"
      - "ats_mapping_jw*.json"
      - "companies_job_watch_v2.json"
      - "watchlist_additions.json"
      - "discovery_candidates.json"
      - "semantic_decisions_jw1.json"
      - "semantic_decisions_jw2.json"
      - "semantic_decisions_jw3.json"
      - "semantic_decisions_jw4.json"
      - "surfaced_jobs_jw1.json"
      - "surfaced_jobs_jw2.json"
      - "surfaced_jobs_jw3.json"
      - "surfaced_jobs_jw4.json"
      - "job_watch_run_state.json"
      - "user_job_decisions.json"

permissions:
  contents: write

concurrency:
  group: job-watch-state-writer
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Sync and publish semantic state
        run: python job_watch.py sync --publish

      - name: Publish readable health summary
        if: always()
        run: |
          if [ -f job_watch_summary.txt ]; then cat job_watch_summary.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve collected checkpoints and health on publication failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-watch-checkpoints-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            current_jobs_jw*.json
            amazon_target_check.json
            job_watch_healthcheck.json
            job_watch_summary.txt
            pipeline_execution.json
            daily_activity.json
            rejected_daily_updates.json
