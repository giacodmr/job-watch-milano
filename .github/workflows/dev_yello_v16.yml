name: Validate Yello v1.6

on:
  push:
    branches:
      - ats-yello-v16
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-watch-yello-v16-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Apply Yello v1.6 collector
        run: python yello_v16_patch.py

      - name: Syntax check
        run: python -m py_compile collector.py coverage_report.py

      - name: Validate Kearney directly
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import collector

          target = None
          for batch in ("jw1", "jw2", "jw3", "jw4"):
              data = json.loads(Path(f"ats_mapping_{batch}.json").read_text(encoding="utf-8"))
              for company in data.get("companies", []):
                  if company.get("company") == "Kearney":
                      target = company
                      break
              if target:
                  break
          assert target, "Kearney mapping missing"
          result = collector.collect_yello(target)
          print("KEARNEY_DIRECT", {k: result.get(k) for k in ("coverage", "collector", "inventory_count", "source_url")})
          print("KEARNEY_TARGET_JOBS", len(result.get("jobs") or []))
          assert result.get("coverage") == "VERIFIED", result
          assert result.get("collector") == "yello_recsolu_public_board_metadata_v16", result
          assert int(result.get("inventory_count") or 0) > 0, result
          assert all(collector.location_matches(x.get("location")) for x in result.get("jobs") or []), result
          PY

      - name: Run full collector
        run: python collector.py

      - name: Validate release invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          totals = {"companies_total": 0, "VERIFIED": 0, "FAILED": 0, "NOT_CHECKED": 0}
          kearney = None
          unilever = None
          for batch in ("jw1", "jw2", "jw3", "jw4"):
              data = json.loads(Path(f"current_jobs_{batch}.json").read_text(encoding="utf-8"))
              assert data.get("version") == "1.6", (batch, data.get("version"))
              for key in totals:
                  totals[key] += int(data["summary"].get(key, 0))
              for company in data.get("companies", []):
                  if company.get("company") == "Kearney":
                      kearney = company
                  if company.get("company") == "Unilever":
                      unilever = company
          print("TOTALS", totals)
          print("KEARNEY", kearney and {k: kearney.get(k) for k in ("coverage", "inventory_count", "collector", "reason")})
          assert totals["companies_total"] == 182, totals
          assert totals["FAILED"] == 0, totals
          assert totals["VERIFIED"] >= 77, totals
          assert kearney and kearney.get("coverage") == "VERIFIED", kearney
          assert kearney.get("collector") == "yello_recsolu_public_board_metadata_v16", kearney
          assert unilever and unilever.get("coverage") == "NOT_CHECKED", unilever
          PY

      - name: Coverage report
        run: python coverage_report.py

      - name: Remove temporary development scaffolding
        shell: bash
        run: |
          rm -f yello_diag_v16.py yello_v16_patch.py
          rm -f .github/workflows/dev_yello_v16.yml
          rm -rf __pycache__

      - name: Commit validated Yello v1.6 state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Yello Recsolu collector v1.6"
          git push
