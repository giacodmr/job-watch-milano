name: ATS FinecoBank - Official Careers Inventory Discovery
on:
  pull_request:
    paths:
      - "tools/ats_fineco_probe.py"
      - "tools/ats_fineco_api_probe.py"
      - ".github/workflows/ats_fineco_probe.yml"
permissions:
  contents: read
jobs:
  fineco-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5
      - name: Discover first-party Fineco careers inventory and JS contracts
        run: python tools/ats_fineco_probe.py
      - name: Inspect Fineco publicly documented jobs API and stability
        run: python tools/ats_fineco_api_probe.py
